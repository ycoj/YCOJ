{% extends "layout/basic.html" %}
{% block content %}
<div class="row pastebin-page">
  <div class="medium-9 columns">
    <div class="section">
      <div class="section__header"><h1 class="section__title">{{ _('Edit Paste') }}</h1></div>
      <div class="section__body">
        <form method="post">
          {% include "partials/paste_form.html" %}
          <div class="row">
            <div class="columns">
              <button name="operation" value="update" type="submit" class="rounded primary button">{{ _('Update') }}</button>
              <button name="operation" value="delete" type="submit" class="rounded button">{{ _('Delete') }}</button>
              <a href="{{ url('paste_detail', id=pdoc._id) }}" class="rounded button">{{ _('Cancel') }}</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
