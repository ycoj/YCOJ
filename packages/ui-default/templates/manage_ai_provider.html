{% extends "manage_base.html" %}
{% block manage_content %}
<div class="section">
  <div class="section__header">
    <h1 class="section__title" data-heading>{{ _('manage_ai_provider') }}</h1>
  </div>
  <div class="section__body">
    <form method="post" id="ai-provider-form">
      <textarea name="value" id="ai-provider-value" hidden>{{ config }}</textarea>
      <div id="ai-provider-editor"></div>
      <div class="row"><div class="column">
        <button type="button" class="rounded button" id="add-provider">{{ _('Add Provider') }}</button>
        <button type="submit" class="rounded primary button">{{ _('Save') }}</button>
      </div></div>
    </form>
  </div>
</div>
{% endblock %}
